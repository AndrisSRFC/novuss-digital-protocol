<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Novuss protokols</title><style>body{font-family:Arial,sans-serif;background:#eef2f5;margin:0;color:#17202a}.card{max-width:520px;margin:14px auto;background:white;border-radius:18px;padding:18px;box-shadow:0 2px 12px #0002}h1{text-align:center;margin:0}.sub{text-align:center;color:#667085}.players{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center;text-align:center}.name{font-weight:700;font-size:18px}.score{font-size:32px;font-weight:800}.games{margin-top:18px}.game{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;margin:8px 0}.game button,.stose button{padding:13px 8px;border:1px solid #ccd2d8;border-radius:10px;background:#f8fafc;font-weight:700}.game button.on{background:#1769aa;color:white}.stose{display:flex;justify-content:center;gap:8px;align-items:center}.stose button{padding:8px 13px}.finish{width:100%;padding:14px;border:0;border-radius:10px;background:#b42318;color:white;font-weight:800;font-size:17px;margin-top:16px}.finish:disabled{opacity:.35}.err{color:#b42318;text-align:center}</style></head><body><div class="card"><h1>NOVUSS</h1><div id="tableNo" class="sub">Ielādē...</div><div id="err" class="err"></div><div id="app" hidden><div class="players"><div><div id="p1" class="name"></div><div class="stose"><button onclick="stose(1,-1)">−</button><b id="st1">0</b><button onclick="stose(1,1)">+</button></div></div><div class="score"><span id="sc1">0</span>:<span id="sc2">0</span></div><div><div id="p2" class="name"></div><div class="stose"><button onclick="stose(2,-1)">−</button><b id="st2">0</b><button onclick="stose(2,1)">+</button></div></div></div><div id="games" class="games"></div><button id="finish" class="finish" onclick="finish()">PABEIGT SPĒLI</button><div id="status" class="sub"></div></div></div><script src="/socket.io/socket.io.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let p=null;
async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Kļūda');return j}
async function load(){if(!token)return fail('Nav telefona piekļuves tokena.');try{let d=await api('/api/phone/'+encodeURIComponent(token));p=d.protocol;render()}catch(e){fail(e.message)}}
function fail(s){document.querySelector('#err').textContent=s;document.querySelector('#app').hidden=true}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.querySelector('#err').textContent='';document.querySelector('#app').hidden=false;document.querySelector('#tableNo').textContent='Galds Nr. '+p.tableNumber;document.querySelector('#p1').textContent=p.player1;document.querySelector('#p2').textContent=p.player2;document.querySelector('#sc1').textContent=p.score1;document.querySelector('#sc2').textContent=p.score2;document.querySelector('#st1').textContent=p.stose1;document.querySelector('#st2').textContent=p.stose2;let g=document.querySelector('#games');g.innerHTML='';p.games.forEach((w,i)=>{let r=document.createElement('div');r.className='game';r.innerHTML='<button class="'+(w===1?'on':'')+'">'+safe(p.player1)+'</button><div style="text-align:center;padding-top:13px">'+(i+1)+'</div><button class="'+(w===2?'on':'')+'">'+safe(p.player2)+'</button>';let bs=r.querySelectorAll('button');bs[0].onclick=()=>game(i,w===1?0:1);bs[1].onclick=()=>game(i,w===2?0:2);g.appendChild(r)});let reachedFour=p.score1>=4||p.score2>=4,done=p.status==='finished';if(reachedFour){g.querySelectorAll('.game').forEach((r,i)=>{if(p.games[i]===0)r.querySelectorAll('button').forEach(b=>b.disabled=true)})}document.querySelectorAll('.stose button').forEach(b=>b.disabled=false);let valid=(p.score1===3&&p.score2===3)||(p.score1>=4&&p.score2<=3)||(p.score2>=4&&p.score1<=3);document.querySelector('#finish').disabled=!valid;document.querySelector('#status').textContent=done?'Spēle pabeigta. Swiss Master komanda: '+p.resultCommand+'. Ja vajag, izlabo rezultātu un nospied PABEIGT SPĒLI vēlreiz.':reachedFour?'Gala rezultāts sasniegts. Nospiediet PABEIGT SPĒLI.':'Pašreizējais rezultāts '+p.score1+':'+p.score2}
async function game(i,w){try{p=await api('/api/table/'+p.id+'/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:i,winner:w})});render()}catch(e){fail(e.message)}}
async function stose(pl,d){try{p=await api('/api/table/'+p.id+'/stose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:pl,delta:d})});render()}catch(e){fail(e.message)}}
async function finish(){try{p=await api('/api/table/'+p.id+'/finish',{method:'POST'});render();alert('Spēle pabeigta. Swiss Master komanda: '+p.resultCommand)}catch(e){alert(e.message)}}
const socket=io();socket.on('protocol-updated',x=>{if(p&&x.id===p.id){p=x;render()}});socket.on('protocol-finished',x=>{if(p&&x.id===p.id){p=x;render()}});socket.on('tournament-ended',()=>fail('Turnīrs ir beidzies. Šī saite vairs nav aktīva.'));load();
</script></body></html>
