<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galdiņu testa priekšskatījums</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:900px;margin:30px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #0001}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.muted{color:#667085;font-size:14px}.row{padding:10px 0;border-bottom:1px solid #eee}.warn{color:#b54708}.ok{color:#067647}</style></head><body><div class="wrap"><div class="card"><h1>Galdiņu testa priekšskatījums</h1><div class="muted">Swiss pārus nemaina un datubāzē neko nesaglabā. Optimizē tikai fizisko galdiņu numurus pēc iepriekšējām kārtām.</div><p><button onclick="run()">Aprēķināt galdiņus</button> <button onclick="location.href='/admin'">Atpakaļ uz Admin</button></p><div id="status" class="muted"></div></div><div class="card"><div id="out" class="muted">Nospied “Aprēķināt galdiņus”.</div></div></div><script>
async function api(u){const r=await fetch(u),j=await r.json();if(!r.ok)throw Error(j.error||'Kļūda');return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function history(rounds){const h=new Map();for(const r of rounds||[])for(const p of r.tables||[])for(const name of [p.player1,p.player2]){if(!h.has(name))h.set(name,[]);h.get(name).push({round:+r.roundNumber,table:+p.tableNumber})}for(const a of h.values())a.sort((x,y)=>x.round-y.round);return h}
function cost(pair,t,h){let c=0;for(const n of [pair.player1,pair.player2]){const a=h.get(n)||[],same=a.filter(x=>x.table===t).length,last=a[a.length-1];if(same>=3)c+=1000000+(same-3)*1000000;else if(same===2)c+=100000;else if(same===1)c+=1000;if(last&&last.table===t)c+=10000}return c}
function assign(pairs,rounds){const n=pairs.length;if(n>20)throw Error('Testa optimizators paredzēts līdz 20 pāriem.');const h=history(rounds),tables=Array.from({length:n},(_,i)=>i+1),memo=new Map();function solve(i,mask){if(i===n)return{cost:0,ch:[]};const k=i+'|'+mask;if(memo.has(k))return memo.get(k);let best=null;for(let j=0;j<n;j++){if(mask&(1<<j))continue;const z=solve(i+1,mask|(1<<j)),v=cost(pairs[i],tables[j],h)+z.cost;if(!best||v<best.cost)best={cost:v,ch:[j,...z.ch]}}memo.set(k,best);return best}const b=solve(0,0);return pairs.map((p,i)=>({...p,tableNumber:tables[b.ch[i]],assignmentCost:cost(p,tables[b.ch[i]],h)})).sort((a,b)=>a.tableNumber-b.tableNumber)}
async function run(){const st=document.querySelector('#status'),out=document.querySelector('#out');st.textContent='Aprēķina...';out.innerHTML='';try{const [sw,rd]=await Promise.all([api('/api/swiss/preview'),api('/api/tournament/rounds')]);const rows=assign(sw.pairs,rd.rounds||[]);st.innerHTML='<span class="ok">'+esc(sw.nextRound)+'. kārta — tikai testa priekšskatījums, DB netiek mainīta.</span>';for(const p of rows){const d=document.createElement('div');d.className='row';d.innerHTML='<b>Galds '+p.tableNumber+':</b> '+esc(p.player1)+' — '+esc(p.player2)+(p.assignmentCost>=100000?'<div class="warn">⚠ Šim pārim nav izdevies pilnībā izvairīties no atkārtota galdiņa.</div>':'');out.appendChild(d)}}catch(e){st.innerHTML='<span class="warn">'+esc(e.message)+'</span>'}}
</script></body></html>
